name: Android CI/CD Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for Gradle wrapper
      run: chmod +x gradlew

    - name: Decode Keystore Binary from GitHub Secret
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

    - name: Dynamically Create keystore.properties credentials file
      run: |
        echo "storeFile=../release.keystore" > keystore.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

    - name: Compile Signed Release APK Build
      run: ./gradlew assembleRelease

    - name: Upload Signed Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: parental-control-signed-release
        path: app/build/outputs/apk/release/app-release.apk

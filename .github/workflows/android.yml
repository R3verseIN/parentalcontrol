name: Android CI/CD Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      HAS_SECRETS: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Set up Build Credentials
      if: env.HAS_SECRETS == 'true'
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > release.keystore
        echo "storeFile=../release.keystore" > keystore.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

    - name: Compile Signed Release APK in Sandboxed Docker
      if: env.HAS_SECRETS == 'true'
      run: |
        chmod +x build.sh
        ./build.sh --release

    - name: Compile Fallback Debug APK in Sandboxed Docker (Secrets Unconfigured)
      if: env.HAS_SECRETS == 'false'
      run: |
        echo "=================================================="
        echo "⚠️ WARNING: Repository secrets are not configured yet."
        echo "Fallback: Building standard debug APK in Docker."
        echo "=================================================="
        chmod +x build.sh
        ./build.sh

    - name: Upload Compiled APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: parental-control-apk
        path: artifacts/*.apk
